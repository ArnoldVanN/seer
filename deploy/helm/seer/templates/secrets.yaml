{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.dsn }}
{{- fail "Set database.dsn or database.existingSecret (Seer needs your Postgres)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seer.dbSecretName" . }}
  labels:
    {{- include "seer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.dsn | quote }}
---
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "seer.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "seer.labels" . | nindent 4 }}
type: Opaque
data:
  # Kept across upgrades so sessions and tokens stay valid.
  internal-jwt-secret: {{ .Values.secrets.internalJwtSecret | b64enc | default (get $existing "internal-jwt-secret") | default (randAlphaNum 48 | b64enc) }}
  session-secret: {{ .Values.secrets.sessionSecret | b64enc | default (get $existing "session-secret") | default (randAlphaNum 48 | b64enc) }}
  {{- with .Values.auth.oidc.clientSecret }}
  oidc-client-secret: {{ . | b64enc }}
  {{- end }}
  {{- if and .Values.auth.admin.password (not .Values.auth.admin.existingSecret) }}
  admin-password: {{ .Values.auth.admin.password | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.secrets.existingSecret .Values.auth.admin.password (not .Values.auth.admin.existingSecret) }}
{{- fail "auth.admin.password needs the chart's secret; with secrets.existingSecret, use auth.admin.existingSecret instead" }}
{{- end }}
