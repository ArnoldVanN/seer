{{- range $c := list "api" "web" }}
{{- $v := index $.Values $c }}
{{- if and $v.hpa.enabled (or (eq $c "web") (eq $.Values.mode "split")) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "seer.fullname" $ }}-{{ $c }}
  labels:
    {{- include "seer.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "seer.fullname" $ }}-{{ $c }}
  minReplicas: {{ $v.hpa.minReplicas }}
  maxReplicas: {{ $v.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
