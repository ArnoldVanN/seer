{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seer.fullname" . }}-api
  labels:
    {{- include "seer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seer.selector" (dict "root" . "component" (include "seer.apiComponent" .)) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public API and metrics: open.
    - ports:
        - { port: 8080 }
        - { port: 9090 }
    # Private API: web pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "seer.selector" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - { port: 8081 }
{{- end }}
