name: DAST

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "**/*.md"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        working-directory: deploy/compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: -a -j
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: Stack logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs
