name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seer
          POSTGRES_PASSWORD: seer
          POSTGRES_DB: seer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seer -d seer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - name: Lint protos
        working-directory: packages/protos
        run: buf lint
      - name: Vet
        working-directory: apps/server
        run: go vet ./...
      - name: Test
        working-directory: apps/server
        env:
          SEER_TEST_DSN: postgres://seer:seer@localhost:5432/seer?sslmode=disable
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build protos
        working-directory: packages/protos
        run: pnpm build
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Build
        working-directory: apps/web
        run: pnpm build

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @seer/protos
      - name: Install protoc plugins
        run: grep -oP '(?<=go install )\S+' scripts/gen.sh | xargs -n1 go install
      - name: Generate
        run: ./scripts/gen.sh
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is out of date. Run pnpm gen and commit the result."
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter docs
      - name: Build
        working-directory: apps/docs
        run: pnpm build
      - name: Lint
        working-directory: apps/docs
        run: pnpm lint
      - name: Typecheck
        working-directory: apps/docs
        run: pnpm typecheck

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Lint
        run: |
          helm lint deploy/helm/seer --set database.dsn=postgres://x
          helm package deploy/helm/seer --version 0.0.0+ci -d dist
          mkdir -p rendered
          helm template t dist/seer-0.0.0+ci.tgz --set database.dsn=postgres://x > rendered/split.yaml
          helm template t dist/seer-0.0.0+ci.tgz --set database.dsn=postgres://x --set mode=combined > rendered/combined.yaml
          helm template t dist/seer-0.0.0+ci.tgz --set database.dsn=postgres://x \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw' \
            --set 'config.sites[0].key=a' --set 'config.sites[0].hosts[0]=status.example.com' \
            --set 'config.sites[0].dashboards[0]=status' \
            --set networkPolicy.enabled=true --set metrics.serviceMonitor.enabled=true \
            --set api.hpa.enabled=true --set web.hpa.enabled=true > rendered/full.yaml
      - name: Validate manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - name: Server-side dry run
        run: |
          kubectl apply --dry-run=server -f rendered/split.yaml
          kubectl apply --dry-run=server -f rendered/combined.yaml
