name: Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "**/*.md"
  workflow_call:
    inputs:
      version:
        description: "Release tag to publish, e.g. v1.2.3"
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web]
    env:
      RELEASE: ${{ inputs.version && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.version || github.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/seer-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ env.RELEASE }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=sha,enable=${{ env.RELEASE == 'false' }}
            type=raw,value=edge,enable=${{ env.RELEASE == 'false' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
